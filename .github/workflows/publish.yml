name: Publish to npm

# Publishes a new npm version on every push/merge to main.
# Other branches never publish.
on:
  push:
    branches:
      - main

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[skip publish]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Bump patch version
        id: version
        run: |
          set -euo pipefail
          current=$(node -p "require('./package.json').version")
          if [[ ! "$current" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Unexpected version format: $current" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          next="${major}.${minor}.$((patch + 1))"

          latest_tag=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1 || true)
          if [[ -n "$latest_tag" ]]; then
            tagged="${latest_tag#v}"
            if [[ "$tagged" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              t_major="${BASH_REMATCH[1]}"
              t_minor="${BASH_REMATCH[2]}"
              t_patch="${BASH_REMATCH[3]}"
              candidate="${t_major}.${t_minor}.$((t_patch + 1))"
              highest=$(printf '%s\n%s\n' "$next" "$candidate" | sort -V | tail -1)
              next="$highest"
            fi
          fi

          npm version "$next" --no-git-tag-version
          echo "value=$next" >> "$GITHUB_OUTPUT"
          echo "Bumped version to $next"

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Commit version bump and tag
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No version file changes to commit"
          else
            git commit -m "chore: release v${VERSION} [skip publish]"
          fi

          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin HEAD:main
          git push origin "v${VERSION}"
